name: Website bug
description: Report a reproducible technical problem without personal or health information.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include patient names, contact details, symptoms, medications, appointment data, credentials, or other sensitive information. Redact screenshots and logs.
  - type: input
    id: url
    attributes:
      label: Public URL
      description: Which public page is affected?
      placeholder: https://vivawellnessco.com/...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the visible behavior and the steps needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device class
      options:
        - Mobile phone
        - Tablet
        - Desktop or laptop
        - Multiple devices
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Safari 18 on iOS 18
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add a screenshot or console error only after removing personal data, tokens, and form values.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no patient, appointment, health, credential, or secret information.
          required: true
